# =============================================================================
# Portable-комплект, автоматика: сборка ggml-cuda/llama-server по требованию.
# =============================================================================
# Что здесь меряется и зачем:
#   - зелёная сборка НЕ доказывает, что наши патчи на месте: маркеры проверяются
#     отдельно, гейтом patch_markers.py по байтам ggml-base.dll / ggml-cuda.dll / llama.dll.
#   - CI-скрипты (build_kit.ps1, install_cuda_redist.ps1, patch_markers.py) и реестр
#     маркеров живут в форке Страты; копировать их сюда - второй источник истины,
#     который расходится при первой же правке. Поэтому Strata проверяется отдельным
#     checkout, а скрипты берутся из него.
#   - build_kit.ps1 требует -StrataSrc безусловно (отказ rc=2 даже для -Engines llama),
#     так что checkout Страты здесь обязателен по двум причинам сразу.
#   - CUDA в образе windows-раннера отсутствует: тулчейн собирается из redist-архивов
#     install_cuda_redist.ps1 с закреплением sha256 по каждому архиву, каталог загрузок
#     кешируется actions/cache.
#   - запуск только по требованию (workflow_dispatch), а не на каждом push: прогон тянет
#     тулчейн CUDA и полную компиляцию ggml-cuda, а проверять состав и маркеры нужно точечно.
#   - -Arch влияет только на ширину codegen (какие SASS/cubin положены в dll), поэтому
#     по умолчанию собирается одна архитектура 86 - быстрый контроль; полный набор 86;89;120
#     собирает и публикует релизный workflow комплекта.
#   - В Actions не меряются предельная цена архитектур (-SkipProbe) и запуск серверов с
#     моделью: для этого нужна видеокарта, а GPU-раннера у форка нет.
name: Kit build (llama.cpp CUDA servers)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: >-
          CUDA-архитектуры через ; (86 - быстрый контроль, 86;89;120 - как в комплекте)
        required: false
        default: '86'

permissions:
  contents: read

concurrency:
  group: kit-build-llama-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: '13.3.1'
  # Русские строки python-гейтов идут в лог шага. Без этих переменных python выбирает кодовую
  # страницу консоли - замер 12.11 на стенде даёт sys.stdout.encoding=cp1251, и строка
  # «приёмка комплекта» уходит 19 байтами cp1251 вместо 35 байт UTF-8. Код возврата при этом 0,
  # то есть прогон зелёный, а приёмка в логе Actions читается как mojibake.
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'
  STRATA_REPO: 'bahooo22/Strata'
  STRATA_REF: 'main'
  # Набор серверов сборки ОДНИМ списком: его читает и гейт полноты, и upload-artifact.
  # Две раздельные копии (paths в шаге + список в гейте) - это ровно класс «названные пути
  # ≠ загруженные файлы», и он же расходится молча, когда список правят только в одном месте.
  ARTIFACT_FILES: |
    llama\build-kit\bin\llama-server.exe
    llama\build-kit\bin\llama-server-impl.dll
    llama\build-kit\bin\llama-common.dll
    llama\build-kit\bin\llama.dll
    llama\build-kit\bin\mtmd.dll
    llama\build-kit\bin\ggml.dll
    llama\build-kit\bin\ggml-base.dll
    llama\build-kit\bin\ggml-cpu.dll
    llama\build-kit\bin\ggml-cuda.dll

jobs:
  llama-cuda:
    name: Сборка llama-server + ggml-cuda под CUDA
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ARCH: ${{ github.event.inputs.arch || '86' }}
    steps:
      - uses: actions/checkout@v4
        with: { path: llama }

      - name: "Дерево Страты: CI-скрипты сборки и реестр маркеров"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STRATA_REPO }}
          ref: ${{ env.STRATA_REF }}
          path: strata
          fetch-depth: 1
          persist-credentials: false

      - name: Контроль входов до компиляции
        shell: bash
        run: |
          for f in strata/packaging/kit/ci/build_kit.ps1 \
                   strata/packaging/kit/ci/install_cuda_redist.ps1 \
                   strata/packaging/kit/ci/patch_markers.py \
                   strata/packaging/kit/ci/patch-markers.json \
                   llama/CMakeLists.txt; do
            if [ ! -f "$f" ]; then echo "::error::нет $f - сборка не начата"; exit 2; fi
          done
          python strata/packaging/kit/ci/patch_markers.py --selftest; rc=$?
          echo "rc(patch_markers --selftest)=$rc"
          [ "$rc" = 0 ]

      - name: Кэш redist-архивов CUDA
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cuda-dl
          key: cuda-dl-${{ env.CUDA_VERSION }}-llama

      - name: Тулчейн CUDA из redist-архивов
        shell: pwsh
        run: |
          $ci = Join-Path $env:GITHUB_WORKSPACE 'strata\packaging\kit\ci'
          & pwsh -NoProfile -NonInteractive -File $ci\install_cuda_redist.ps1 `
              -Root (Join-Path $env:RUNNER_TEMP 'cuda') `
              -CacheDir (Join-Path $env:RUNNER_TEMP 'cuda-dl') `
              -CudaVersion $env:CUDA_VERSION
          Write-Host "rc(install_cuda_redist)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Сборка сервера llama.cpp под CUDA
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $ci = Join-Path $ws 'strata\packaging\kit\ci'
          & pwsh -NoProfile -NonInteractive -File $ci\build_kit.ps1 `
              -StrataSrc (Join-Path $ws 'strata') `
              -LlamaSrc (Join-Path $ws 'llama') `
              -Cuda (Join-Path $env:RUNNER_TEMP 'cuda') `
              -Out (Join-Path $env:RUNNER_TEMP 'kit') `
              -Engines llama -Arch $env:ARCH -SkipProbe
          Write-Host "rc(build_kit)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Гейт «наши патчи в собранных dll»
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $bd = Join-Path $ws 'llama\build-kit\bin'
          python (Join-Path $ws 'strata\packaging\kit\ci\patch_markers.py') `
              --engine llama `
              --bin (Join-Path $bd 'ggml-base.dll') `
              --bin (Join-Path $bd 'ggml-cuda.dll') `
              --bin (Join-Path $bd 'llama.dll') `
              --out (Join-Path $env:RUNNER_TEMP 'kit\markers-llama.json')
          Write-Host "rc(patch_markers)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Меры и логи прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-measures-llama-${{ github.run_number }}
          path: |
            ${{ runner.temp }}\kit\build-measure.partial.json
            ${{ runner.temp }}\kit\elf-proof.partial.json
            ${{ runner.temp }}\kit\markers-llama.json
            ${{ runner.temp }}\kit\build-llama.log
          retention-days: 14
          if-no-files-found: warn

      - name: Гейт «набор артефакта собран полностью»
        shell: pwsh
        run: |
          # why not if-no-files-found: error: первичник actions/upload-artifact
          # (src/upload/upload-artifact.ts:31) включает его только на ПУСТОЕ множество
          # (filesToUpload.length === 0), а поиск - один глоб по всем путям сразу
          # (src/shared/search.ts:82-91). Красный прогон 43345549955 утащил этот артефакт
          # из 4 бинарников вместо 9 именно так: множество непустое, и флаг молчит.
          # Здесь меряется наличие каждого названного файла, а не «есть ли хоть один».
          $files = @($env:ARTIFACT_FILES -split '\r?\n' | Where-Object { $_ })
          if ($files.Count -eq 0) {
              Write-Host "::error::ARTIFACT_FILES пуст - набор не назван, мерять нечего"
              exit 2
          }
          $missing = @($files | Where-Object {
              -not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $_))
          })
          if ($missing) {
              Write-Host ("::error::нет {0} файлов из набора ({1} названо): {2}" -f
                  $missing.Count, $files.Count, ($missing -join ', '))
              exit 1
          }
          Write-Host "набор артефакта: $($files.Count) файлов на месте"

      - name: Бинарники llama.cpp
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-servers-${{ github.sha }}
          # Тот же набор, что укладывает в комплект pack_kit: обёртка llama-server.exe без
          # llama-server-impl.dll и llama-common.dll не запускается, а ggml.dll и ggml-cpu.dll
          # зовут её из ggml-base. Сокращать список до «трёх носителей маркеров» нельзя -
          # артефакт сборки называют набором серверов, и он обязан быть набираемым.
          # cublas остаётся за пределом: он приезжает из redist-архива, а не из этого дерева.
          # Список лежит в env.ARTIFACT_FILES: его же проверяет гейт полноты выше.
          path: ${{ env.ARTIFACT_FILES }}
          retention-days: 14
          # Пустое множество - отдельная поломка (сборка не произвела ничего), и она обязана
          # быть красной, а не warn. Шаги мер выше остаются на warn осознанно: у них
          # if: always(), и пустой лог меры - симптом уже упавшего job, а не новая причина.
          if-no-files-found: error
